<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Blackjack Cool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>♠️ Blackjack Royal ♦️</h1>
        
        <div class="area">
            <h2>Croupier : <span id="dealer-score">0</span></h2>
            <div id="dealer-cards" class="cards-row"></div>
        </div>

        <div class="area">
            <h2>Joueur : <span id="player-score">0</span></h2>
            <div id="player-cards" class="cards-row"></div>
        </div>

        <div id="controls">
            <button id="hit-btn">Carte !</button>
            <button id="stand-btn">Je reste</button>
            <button id="reset-btn" class="hidden">Rejouer</button>
        </div>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
